# Welcome to the chrony configuration file. See chrony.conf(5) for more
# information about usable directives.

# Include configuration files found in /etc/chrony/conf.d.
confdir /etc/chrony/conf.d

# Use Debian vendor zone.
pool 2.debian.pool.ntp.org iburst

# Use time sources from DHCP.
sourcedir /run/chrony-dhcp

# Use NTP sources found in /etc/chrony/sources.d.
sourcedir /etc/chrony/sources.d

# This directive specify the location of the file containing ID/key pairs for
# NTP authentication.
keyfile /etc/chrony/chrony.keys

# This directive specify the file into which chronyd will store the rate
# information.
driftfile /var/lib/chrony/chrony.drift

# Save NTS keys and cookies.
ntsdumpdir /var/lib/chrony

# Uncomment the following line to turn logging on.
# Statistiklogging aktiviert (war bisher auskommentiert).
#   tracking     -> tracking.log: Zustand der Systemuhr bei jedem Update
#                   (Offset, Frequenz, Skew) - zeigt das Regelverhalten
#   measurements -> measurements.log: jedes empfangene NTP-Paket, je Quelle
#   statistics   -> statistics.log: Regressionsdaten je Quelle
#   refclocks    -> refclocks.log: rohe UND gefilterte Messwerte der
#                   Referenzuhr. Das ist für dieses Projekt der wichtigste
#                   Teil: hier steht schwarz auf weiß, wie die DCF77-Samples
#                   wandern. Genau diese Daten fehlten bislang, wenn die
#                   Empfängerverzögerung nachjustiert werden musste.
#
# Datenmenge: grob 300 KB pro Tag für alle vier zusammen, also gut 100 MB
# im Jahr. Auf einer SD-Karte relevant, aber vertretbar - logrotate
# begrenzt das Wachstum (siehe /etc/logrotate.d/chrony).
log tracking measurements statistics refclocks

# Log files location.
logdir /var/log/chrony

# Stop bad estimates upsetting machine clock.
maxupdateskew 100.0

# This directive enables kernel synchronisation (every 11 minutes) of the
# real-time clock. Note that it can't be used along with the 'rtcfile' directive.
rtcsync

# Step the system clock instead of slewing it if the adjustment is larger than
# one second, but only in the first three clock updates.
makestep 1 3

# Get TAI-UTC offset and leap seconds from the system tz database.
# This directive must be commented out when using time sources serving
# leap-smeared time.
leapsectz right/UTC

# ============================================================
# Ab hier: Ergänzungen für DCF77 als lokale Referenzuhr
# ============================================================

# DCF77 als bevorzugte lokale Referenzuhr über SHM (Unit 0).
# Der Dekoder (dcf77_ntp_shm.py) schreibt die Zeit dort jede Minute rein.
# poll 6 = 64 Sekunden "Abfrageintervall" (rein informativ für chrony,
#   das SHM wird ohnehin nur einmal pro Minute aktualisiert)
# refid DCF = Anzeigename in "chronyc sources"
# prefer = DCF77 wird gegenüber Internet-NTP-Quellen bevorzugt,
#   sobald sie als ausreichend gut bewertet wird
# precision 1e-2 = 10 Millisekunden.
#   WICHTIG: chrony nimmt für SHM-Refclocks standardmäßig 1e-6 (also
#   1 Mikrosekunde) an. Das ist für diesen Aufbau um Größenordnungen zu
#   optimistisch: Der Dekoder pollt den GPIO-Pin alle 10 ms in Software,
#   damit ist die Auflösung der Zeitstempel strukturell auf ~10 ms
#   begrenzt. Mit dem zu optimistischen Standardwert schätzt chrony die
#   Dispersion der Quelle zu niedrig und gewichtet sie zu stark.
#   Der ehrliche Wert lässt die Quelle korrekt gegen die Internet-Server
#   abwägen, statt sie zu überschätzen.
# filter 1 = jeder einzelne Messwert wird sofort verwendet.
#   WICHTIG: Standardmäßig nutzt chrony einen Median-Filter der Länge 64.
#   Bei SHM liest chrony das Segment jede Sekunde ab und erwartet
#   entsprechend viele Messwerte pro Abfrage - unser Dekoder liefert aber
#   nur EINEN pro Minute. Der Filter wurde dadurch nie ausreichend
#   gefüllt, chrony produzierte nur sporadisch einen verwertbaren Wert,
#   und das Reach-Register dümpelte bei 1-2 von 8 Treffern.
#   Mit filter 1 zählt jeder Minutenwert direkt.
refclock SHM 0 poll 6 filter 1 refid DCF prefer precision 1e-2

# Notlauf, wenn ALLE Quellen ausfallen (DCF77 gestört UND Internet weg).
# Ohne diese Zeile meldet chronyd in dem Fall "not synchronised" und
# beantwortet keine Anfragen mehr - die rund 40 Clients im Netz stünden
# dann ohne Zeitquelle da, das DrayTek-Modem fiele wieder auf 2000-01-01
# zurück.
#
# Mit "local" liefert der Server stattdessen seine eigene, zuletzt sauber
# disziplinierte Systemuhr weiter aus. Die läuft dank driftfile mit der
# gelernten Frequenzkorrektur und bleibt über Stunden brauchbar.
#
# Stratum 10 ist bewusst hoch gewählt: Die Clients sehen daran, dass die
# Qualität gerade schlechter ist, und können selbst entscheiden. Der Wert
# kann nicht mit dem Normalbetrieb verwechselt werden - mit DCF77 ist
# dieser Server Stratum 1, über die Internet-Quellen Stratum 3 bis 4.
#
# Das ist ein bewusster Kompromiss: Verfügbarkeit vor nachweisbarer
# Genauigkeit. Für ein Heimnetz ist eine leicht driftende Zeit deutlich
# besser als gar keine.
local stratum 10

# Diesen Pi als NTP-Server fürs interne Netz freigeben.
# WORKGROUP-IoT
# Hier die eigenen Netze eintragen. Ohne allow-Zeile beantwortet
# chronyd nur Anfragen von localhost.
allow 192.0.2.0/24
# WORKGROUP-main
allow 203.0.113.0/24
# Camera-LAN
allow 198.51.100.0/24
# Service Network
allow 192.168.6.0/24
# Management Network
allow 192.168.5.0/24
#------------------------
# SIC e.V. Main Network
# Mobile Network (SICnet)
# Camera LAN
# Management Network
