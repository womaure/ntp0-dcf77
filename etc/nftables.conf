#!/usr/sbin/nft -f
#
# nftables-Regelwerk fuer ntp-0 (Raspberry Pi 1 Model B+, DCF77-NTP-Server)
#
# Installation:
#   sudo cp nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables
#   sudo nft -f /etc/nftables.conf     # sofort aktivieren
#   sudo nft list ruleset              # zum Pruefen
#
# WICHTIG: Vor dem Aktivieren sicherstellen, dass eine aktive SSH-Sitzung
# offen bleibt, falls sich doch ein Tippfehler eingeschlichen hat - dann
# kannst du notfalls noch gegensteuern, ohne dich auszusperren.

flush ruleset

table inet filter {

    # Erlaubte Quell-Subnetze (Heimnetz + SIC e.V.)
    set allowed_nets {
        type ipv4_addr
        flags interval
        elements = {
            # WORKGROUP-IoT
            192.0.2.0/24,
            # WORKGROUP-main
            203.0.113.0/24,
            # Camera-LAN
            198.51.100.0/24,
            # Service Network
            192.168.6.0/24,
            # Management Network
            192.168.5.0/24,
            # SIC e.V. Main Network
            # Mobile Network (SICnet)
            # Camera LAN (SIC e.V.)
            # Management Network (SIC e.V.)
            192.168.1.0/24
        }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback immer erlauben
        iif "lo" accept

        # Bereits bestehende / zugehoerige Verbindungen erlauben
        # (wichtig fuer Antworten auf eigene ausgehende Verbindungen,
        # z.B. NTP-Pool-Abfragen, MQTT-Verbindung zu Home Assistant)
        ct state established,related accept

        # Ungueltige Pakete verwerfen
        ct state invalid drop

        # SSH nur aus den bekannten Subnetzen
        ip saddr @allowed_nets tcp dport 22 accept

        # NTP (Client-Abfragen) nur aus den bekannten Subnetzen
        ip saddr @allowed_nets udp dport 123 accept

        # ICMP (Ping) aus den bekannten Subnetzen erlauben - hilfreich
        # fuer Diagnose, kein Sicherheitsrisiko in dieser Form
        ip saddr @allowed_nets icmp type echo-request accept

        # Alles andere wird durch die policy drop oben ohnehin verworfen.
        # Explizites Logging optional (auskommentiert, da es bei viel
        # Traffic unnoetig Log-Speicher/CPU kostet):
        # log prefix "nft-input-drop: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # Dieser Pi routet nichts weiter - alles verwerfen.
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Ausgehender Verkehr wird nicht eingeschraenkt (NTP-Pool-Abfragen,
        # MQTT zu Home Assistant, apt-Updates, etc. sollen normal
        # funktionieren).
    }
}
